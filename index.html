<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sync">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<title>Sync</title>
<style>
  :root {
    --bg: #f6f6f4; --fg: #1d1d1b; --muted: #77776f; --line: #dcdcd6; --card: #ffffff; --accent: #3b5b7a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --fg: #ececea; --muted: #8e8e86; --line: #2c2c2a; --card: #1f1f1d; --accent: #8fb0cf; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    -webkit-user-select: none; user-select: none;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 8px 0 16px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
  input[type=text], textarea {
    width: 100%; font: inherit; font-size: 15px; color: var(--fg); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; -webkit-user-select: text; user-select: text;
  }
  textarea { min-height: 84px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .check { display: flex; gap: 10px; align-items: center; margin-top: 14px; font-size: 15px; color: var(--fg); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; word-break: break-all;
          background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
          -webkit-user-select: all; user-select: all; }
  button {
    font: inherit; border: 0; border-radius: 10px; padding: 12px 16px; cursor: pointer;
    background: var(--accent); color: var(--bg);
  }
  button.plain { background: transparent; color: var(--muted); padding: 8px 0; }
  .row { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-top: 20px; }
  .err { color: #b3261e; font-size: 14px; min-height: 1.4em; margin-top: 10px; }
  #sync {
    display: block; width: 100%; margin-top: 30vh; padding: 28px; font-size: 18px;
    background: var(--card); color: var(--fg); border: 1px solid var(--line);
    transition: background 1.5s linear;
  }
  #sync.holding { background: var(--line); }
  #status { text-align: center; color: var(--muted); font-size: 13px; min-height: 1.4em; margin-top: 14px; }
  .hint { font-size: 13px; color: var(--muted); }
  .timer { margin-top: 28px; }
  .timer .label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .row3 { display: flex; gap: 10px; }
  .row3 button { flex: 1; background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  #timerText { font-size: 17px; margin-bottom: 10px; }
</style>
</head>
<body>
<main>
  <section id="setup" hidden>
    <h1>Setup</h1>
    <label>This device's key (add it to your watchers)</label>
    <div id="npub" class="mono"></div>
    <label for="device">Device name shown to contacts</label>
    <input id="device" type="text" autocomplete="off">
    <label for="watchers">Watcher keys (npub), one per line</label>
    <textarea id="watchers" spellcheck="false"></textarea>
    <label for="relays">Relays, one per line</label>
    <textarea id="relays" spellcheck="false"></textarea>
    <div class="check"><input id="useLocation" type="checkbox"><label for="useLocation" style="margin:0;color:inherit;font-size:15px">Include location</label></div>
    <label for="topic">Shortcut topic (keep it secret; the same as in your watchers' config)</label>
    <input id="topic" type="text" class="mono" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="row3" style="margin-top:10px">
      <button id="copyTopic" type="button">Copy topic</button>
    </div>
    <div class="row3" id="shortcutLinks" style="margin-top:10px" hidden>
      <button id="addDuress" type="button">Add Duress shortcut</button>
      <button id="addOk" type="button">Add OK shortcut</button>
    </div>
    <p class="hint" id="topicHint">Adding a shortcut asks for the topic: paste it, it is already copied.</p>
    <div class="check"><input id="autoSend" type="checkbox"><label for="autoSend" style="margin:0;color:inherit;font-size:15px">Send as soon as the app opens</label></div>
    <p class="hint">With this on, opening the app is the signal. Opening it again within a minute sends nothing.</p>
    <div class="err" id="setupError"></div>
    <p class="hint" id="version"></p>
    <div class="row">
      <button class="plain" id="newKey" type="button">New key</button>
      <button id="save" type="button">Save</button>
    </div>
  </section>

  <section id="main" hidden>
    <button id="sync" type="button">Hold to sync</button>
    <div id="status"></div>
    <div class="timer">
      <div class="label">Timer</div>
      <div id="timerStart" class="row3">
        <button type="button" data-min="15">15 min</button>
        <button type="button" data-min="30">30 min</button>
        <button type="button" data-min="60">60 min</button>
      </div>
      <div id="timerRun" hidden>
        <div id="timerText"></div>
        <div class="row3">
          <button type="button" id="timerDone">Done</button>
          <button type="button" id="timerMore">+15 min</button>
        </div>
      </div>
    </div>
    <div class="row"><span></span><button class="plain" id="openSetup" type="button">Settings</button></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>

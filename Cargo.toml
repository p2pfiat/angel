[workspace]
resolver = "2"
members = ["proto", "watcher", "agent-windows"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Default TLS (rustls + ring). On Windows ARM64, ring needs clang: see docs/building.md.
nostr-sdk = "0.45"
nostr = { version = "0.45", features = ["nip59", "os-rng"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
warn-proto = { path = "proto" }
warn-watcher = { path = "watcher" }

[profile.release]
opt-level = "z"
lto = true
strip = true
